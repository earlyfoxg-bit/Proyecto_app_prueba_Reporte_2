<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Reportes</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}
header{background:#2563eb;color:#fff;padding:16px}
h1{margin:0;font-size:1.3rem}
main{max-width:600px;margin:0 auto;padding:16px}
form{display:flex;flex-direction:column;gap:10px}
input,textarea,select{padding:12px;font-size:1rem;border:1px solid #d1d5db;border-radius:8px;font-family:inherit}
button{padding:12px;font-size:1rem;border:0;border-radius:8px;background:#2563eb;color:#fff}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
li h3{margin:0 0 4px;font-size:1rem}
li p{margin:4px 0;white-space:pre-wrap}
li small{color:#6b7280}
.borrar{background:#dc2626;padding:6px 10px;font-size:.85rem;margin-top:6px}
#auto{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);border-left:4px solid #2563eb;margin-bottom:16px;overflow-wrap:anywhere}
#auto h3{margin:0 0 4px;font-size:1.05rem}
#auto p{margin:6px 0;white-space:pre-wrap;line-height:1.4}
#auto small{color:#6b7280}
#auto .resumen{font-weight:600}
#auto dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
#auto dt{color:#6b7280}
#auto dd{margin:0}
#auto details{border-top:1px solid #e5e7eb;margin-top:10px;padding-top:8px}
#auto summary{font-weight:600;cursor:pointer;padding:4px 0}
#auto .item{background:#f9fafb;border-radius:8px;padding:8px;margin:6px 0;font-size:.92rem}
#auto .item b{display:block}
#auto .tag{display:inline-block;font-size:.75rem;padding:1px 6px;border-radius:6px;background:#dbeafe;color:#1e40af;margin-right:4px}
#auto .alto{background:#fee2e2;color:#991b1b}
#auto .medio{background:#ffedd5;color:#9a3412}
#auto a{color:#2563eb}
#auto .aviso{color:#6b7280;font-size:.8rem}
#recargar{padding:6px 10px;font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<header><h1>📋 Reportes</h1></header>
<main>
  <h2>Reporte automático</h2>
  <section id="auto">Cargando…</section>

  <form id="form">
    <input id="titulo" placeholder="Título" required>
    <textarea id="descripcion" placeholder="Descripción" rows="4" required></textarea>
    <select id="prioridad">
      <option>Baja</option>
      <option selected>Media</option>
      <option>Alta</option>
    </select>
    <button type="submit">Guardar reporte</button>
  </form>
  <h2>Mis reportes</h2>
  <ul id="lista"></ul>
</main>
<script>
const KEY='reportes';
const lista=document.getElementById('lista');
const form=document.getElementById('form');
const auto=document.getElementById('auto');
const cargar=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const guardar=r=>localStorage.setItem(KEY,JSON.stringify(r));

function fmtFecha(f){
  const s=String(f);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  const d=new Date(s);
  return isNaN(d)?s:d.toLocaleString('es-MX');
}

/* ---------- ayudas para dibujar ---------- */
function el(tag,text,cls){
  const e=document.createElement(tag);
  if(text!=null) e.textContent=String(text);
  if(cls) e.className=cls;
  return e;
}
const arr=x=>Array.isArray(x)?x:[];
function sec(titulo,abierta){
  const d=document.createElement('details');
  if(abierta) d.open=true;
  d.appendChild(el('summary',titulo));
  return d;
}
function kv(items){
  const dl=document.createElement('dl');
  items.forEach(i=>{dl.append(el('dt',i.concepto),el('dd',i.valor));});
  return dl;
}
function claseImpacto(t){
  const s=String(t||'').toLowerCase();
  return s.includes('alt')?'alto':(s.includes('med')?'medio':'');
}

/* ---------- reporte diario completo (DXY y MNQ) ---------- */
function esReporteCompleto(r){
  return r&&typeof r==='object'&&(r.dxy||r.nasdaq||r.eventos_usd||r.escenarios);
}
function dibujarCompleto(r){
  auto.appendChild(el('h3',r.titulo||'Reporte'));
  const meta=[r.fecha&&fmtFecha(r.fecha),r.generado].filter(Boolean).join(' · ');
  if(meta) auto.appendChild(el('small',meta));
  if(r.resumen) auto.appendChild(el('p',r.resumen,'resumen'));

  if(r.dxy){
    const s=sec('Dólar (DXY)',true);
    if(r.dxy.texto) s.appendChild(el('p',r.dxy.texto));
    if(arr(r.dxy.datos).length) s.appendChild(kv(arr(r.dxy.datos)));
    auto.appendChild(s);
  }
  if(r.noticias){
    const s=sec('Noticias',false);
    if(r.noticias.ayer){s.appendChild(el('b','Ayer'));s.appendChild(el('p',r.noticias.ayer));}
    if(r.noticias.hoy){s.appendChild(el('b','Hoy'));s.appendChild(el('p',r.noticias.hoy));}
    auto.appendChild(s);
  }
  if(arr(r.eventos_usd).length||r.nota_eventos){
    const s=sec('Eventos del USD (impacto medio y alto)',true);
    arr(r.eventos_usd).forEach(ev=>{
      const it=el('div',null,'item');
      const b=el('b');
      if(ev.bloque) b.appendChild(el('span',ev.bloque,'tag'));
      if(ev.impacto) b.appendChild(el('span',ev.impacto,'tag '+claseImpacto(ev.impacto)));
      b.appendChild(document.createTextNode((ev.hora?ev.hora+' · ':'')+(ev.evento||'')));
      it.appendChild(b);
      const det=['Anterior: '+(ev.anterior||'—'),'Pronóstico: '+(ev.pronostico||'—'),'Real: '+(ev.real||'—')].join(' · ');
      it.appendChild(el('small',det));
      s.appendChild(it);
    });
    if(r.nota_eventos) s.appendChild(el('p',r.nota_eventos));
    auto.appendChild(s);
  }
  if(r.nasdaq){
    const s=sec('Nasdaq y MNQ',true);
    if(r.nasdaq.texto) s.appendChild(el('p',r.nasdaq.texto));
    arr(r.nasdaq.puntos).forEach(p=>s.appendChild(el('p','• '+p)));
    auto.appendChild(s);
  }
  if(arr(r.niveles).length){
    const s=sec('Niveles de mercado',true);
    s.appendChild(kv(arr(r.niveles)));
    auto.appendChild(s);
  }
  if(arr(r.escenarios).length){
    const s=sec('Escenarios para Nueva York',true);
    arr(r.escenarios).forEach(e=>{
      const it=el('div',null,'item');
      it.appendChild(el('b',e.tipo));
      it.appendChild(el('span',e.texto));
      s.appendChild(it);
    });
    auto.appendChild(s);
  }
  if(arr(r.agenda).length){
    const s=sec('Agenda del día',false);
    s.appendChild(kv(arr(r.agenda).map(a=>({concepto:a.hora,valor:a.evento}))));
    auto.appendChild(s);
  }
  if(r.conclusion){
    const s=sec('Conclusión',true);
    s.appendChild(el('p',r.conclusion));
    auto.appendChild(s);
  }
  if(arr(r.fuentes).length){
    const s=sec('Fuentes',false);
    arr(r.fuentes).forEach(f=>{
      const p=el('p');
      if(f.url&&/^https:\/\//.test(f.url)){
        const a=el('a',f.titulo||f.url);
        a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';
        p.appendChild(a);
      }else p.textContent=f.titulo||'';
      s.appendChild(p);
    });
    auto.appendChild(s);
  }
  if(r.aviso) auto.appendChild(el('p',r.aviso,'aviso'));
}

/* ---------- cualquier otro reporte (formato simple) ---------- */
function dibujarSimple(r){
  auto.appendChild(el('h3',r.titulo||'Reporte'));
  if(r.fecha) auto.appendChild(el('small',fmtFecha(r.fecha)));
  if(r.descripcion) auto.appendChild(el('p',r.descripcion));
  const dl=document.createElement('dl');
  Object.entries(r).forEach(([k,v])=>{
    if(['titulo','fecha','descripcion'].includes(k)) return;
    dl.append(el('dt',k),el('dd',(v&&typeof v==='object')?Object.values(v).join(', '):String(v)));
  });
  if(dl.children.length) auto.appendChild(dl);
}

async function cargarAuto(){
  auto.textContent='Cargando…';
  try{
    const res=await fetch('reporte.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const r=await res.json();
    auto.innerHTML='';
    if(esReporteCompleto(r)) dibujarCompleto(r); else dibujarSimple(r);
  }catch(err){
    auto.textContent='No se pudo cargar el reporte ('+err.message+')';
  }
  const b=document.createElement('button');
  b.id='recargar';b.textContent='Actualizar';b.onclick=cargarAuto;
  auto.appendChild(b);
}

function mostrar(){
  const rs=cargar();
  lista.innerHTML='';
  if(!rs.length){lista.innerHTML='<li>Aún no hay reportes</li>';return;}
  rs.forEach(r=>{
    const li=document.createElement('li');
    const h=document.createElement('h3');h.textContent=r.titulo+' · '+r.prioridad;
    const p=document.createElement('p');p.textContent=r.descripcion;
    const s=document.createElement('small');s.textContent=new Date(r.fecha).toLocaleString('es-MX');
    const b=document.createElement('button');b.className='borrar';b.textContent='Borrar';
    b.onclick=()=>{guardar(cargar().filter(x=>x.id!==r.id));mostrar();};
    li.append(h,p,s,document.createElement('br'),b);
    lista.appendChild(li);
  });
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const rs=cargar();
  rs.unshift({
    id:Date.now(),
    titulo:document.getElementById('titulo').value.trim(),
    descripcion:document.getElementById('descripcion').value.trim(),
    prioridad:document.getElementById('prioridad').value,
    fecha:new Date().toISOString()
  });
  guardar(rs);form.reset();mostrar();
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
mostrar();
cargarAuto();
</script>
</body>
</html>
